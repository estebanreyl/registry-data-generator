# Values file for registry scenario: acr-50l-50mb
# 50 layers, 50MB each, 2500MB total image size
# 6,291 images for ~15TB total

env:
  # Number of Docker images to create
  numberOfImages: 6291

  # Number of layers per image  
  numberOfLayers: 50

  # Size of each layer (in KB) - 50MB = 51200KB
  sizeOfLayersKb: '51200'

  # Number of upload threads
  numOfThreads: 12

  # Registry URI - update with your registry
  registryUri: your-registry.azurecr-test.io

  # Set --insecure-registry flag
  insecureRegistry: false

  # Docker user - update with your credentials
  dockerUser: ""

  # Docker password - update with your credentials  
  dockerPassword: ""

  # Directory path in the registry
  repoPath: docker-auto

  # Remove images once done
  removeImages: false

  # Image tag
  tag: 1

  # Debug output
  debug: false

resources:
  requests:
    cpu: 1
    memory: 4Gi
  limits:
    cpu: 4
    memory: 12Gi
